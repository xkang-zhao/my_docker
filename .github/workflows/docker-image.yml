name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 【必须新增】给 GitHub Actions 推送镜像的权限
    permissions:
      packages: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    # 【必须新增】登录到 GitHub 自己的镜像仓库 (GHCR)
    - name: Log in to registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    # 【修改】构建，并直接 push 到仓库中
    - name: Build and Push the Docker image
      run: |
        # 获取你的 GitHub 用户名并全部转为小写 (Docker 镜像名不允许有大写字母)
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_NAME="ghcr.io/$OWNER/my-image-name"
        
        # 构建镜像，打上 latest 标签
        docker build . --file Dockerfile --tag $IMAGE_NAME:latest
        
        # 把镜像推送到云端保存，这样你本地才能 pull
        docker push $IMAGE_NAME:latest
